spring.application.name=AuthenticationService
spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_service}
spring.datasource.username=${AUTH_DB_USERNAME:auth_user}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${AUTH_SHOW_SQL:false}

server.port=${AUTH_SERVER_PORT:8081}
logging.level.org.springframework.security=${AUTH_SECURITY_LOG_LEVEL:INFO}

auth.issuer=${AUTH_ISSUER_URI:http://localhost:8081}
auth.signing.jwk-set-location=${AUTH_JWK_SET_LOCATION}
auth.bootstrap-client.enabled=${AUTH_BOOTSTRAP_CLIENT_ENABLED:false}
auth.bootstrap-client.client-id=${AUTH_OIDC_CLIENT_ID:platform-bff}
auth.bootstrap-client.client-secret=${AUTH_OIDC_CLIENT_SECRET:}
auth.bootstrap-client.redirect-uri=${AUTH_OIDC_REDIRECT_URI:http://127.0.0.1:3000/api/auth/callback}
auth.bootstrap-client.post-logout-redirect-uri=${AUTH_OIDC_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:3000/}
auth.audience=${AUTH_AUDIENCE:platform-api}
auth.machine-client.enabled=${AUTH_MACHINE_CLIENT_ENABLED:false}
auth.machine-client.client-id=${AUTH_MACHINE_CLIENT_ID:platform-e2e}
auth.machine-client.client-secret=${AUTH_MACHINE_CLIENT_SECRET:}
